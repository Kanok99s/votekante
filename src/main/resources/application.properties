# =====================================================================
# VoteKante — Spring Boot configuration
#
# Every setting can be overridden by an environment variable (the value
# after the colon is the local-development default). This is what lets
# the SAME application.properties work on a laptop and on Render.
# =====================================================================
spring.application.name=votekante

# ------------------------------------------------------------------
# MySQL connection
# Local default: database "votekante" on localhost:3306 as user "root"
# with password "root". Change DB_USERNAME/DB_PASSWORD to match your
# local MySQL install.
# On Render, set DB_URL / DB_USERNAME / DB_PASSWORD to your external
# MySQL host.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/votekante?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------
# JPA / Hibernate
#   update = Hibernate creates missing tables/columns automatically.
#   For a production DB, switch to "validate" once the schema is stable.
#   open-in-view=false: no lazy loading inside templates — services must
#   load everything the view needs (we do this deliberately).
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ------------------------------------------------------------------
# Thymeleaf (cache disabled in dev so you see template edits instantly)
# ------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------
# Server
# PORT is injected automatically by Render; 8080 is the local default.
# ------------------------------------------------------------------
server.port=${PORT:8080}

# ------------------------------------------------------------------
# First-run bootstrap (see bootstrap/DemoDataInitializer)
# SEED_DEMO=true seeds a demo election + parties + a demo voter so you
# can click through the whole flow on first boot. Turn it off (false)
# once you go live. The admin account is ALWAYS created if no user
# exists — set ADMIN_USERNAME / ADMIN_PASSWORD to strong values.
# ------------------------------------------------------------------
app.seed-demo-data=${SEED_DEMO:true}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
