<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">VoteKante</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>

<!-- ============ Site header (public + signed-in pages) ============ -->
<header th:fragment="header" class="site-header">
    <div class="wrap">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 12.5l2 2 4-4.5"/>
                    <rect x="3.5" y="4" width="17" height="16" rx="3"/>
                </svg>
            </span>
            VoteKante
        </a>

        <nav class="main-nav" aria-label="Main">
            <a sec:authorize="!isAuthenticated()" th:href="@{/polls/browse}">Polls</a>
            <a sec:authorize="hasRole('VOTER')" th:href="@{/voter}">Vote</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/elections}">Manage</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/polls/new}">Create poll</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/polls/mine}">My polls</a>
            <a th:href="@{/results}">Results</a>
        </nav>

        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="margin-left:0.35rem;">
            <span class="user-chip" sec:authentication="name">voter</span>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="logout-btn">Sign out</button>
        </form>
        <a sec:authorize="!isAuthenticated()" class="logout-btn" style="text-decoration:none; margin-left:0.35rem;"
           th:href="@{/login}">Sign in</a>
    </div>
</header>

<!-- ============ Alert / flash messages ============ -->
<div th:fragment="alerts" th:if="${message != null or error != null or ok != null}" class="page" style="padding-bottom:0; max-width:1040px;">
    <div th:if="${error}" class="alert alert-error" th:text="${error}">Error</div>
    <div th:if="${ok}" class="alert alert-ok" th:text="${ok}">Done</div>
    <div th:if="${message}" class="alert alert-info" th:text="${message}">Message</div>
</div>

<!-- ============ Footer ============ -->
<footer th:fragment="footer" class="site-footer">
    <div class="wrap">
        <span>VoteKante — every ballot is anonymous and counted exactly once.</span>
        <span><a th:href="@{/results}">Live results</a></span>
    </div>
</footer>

</body>
</html>
